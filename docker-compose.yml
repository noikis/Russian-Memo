services:
  web:
    build: .
    container_name: memo-web
    command: >
      sh -c "
      python manage.py migrate &&
      python manage.py runserver 0.0.0.0:8000
      "
    env_file:
      - .env
    expose:
      - "8000"
    ports:
      - "${WEB_BIND_ADDRESS:-127.0.0.1}:${WEB_PORT:-18000}:8000"
    volumes:
      - type: bind
        source: .
        target: /app
    networks:
      - default
      - proxy
    restart: unless-stopped
    
  tgbot:
    build: .
    container_name: memo-tgbot
    command: python manage.py runtgbot
    env_file:
      - .env
    volumes:
      - .:/app
    restart: unless-stopped

  vkbot:
    build: .
    container_name: memo-vkbot
    command: python manage.py runvkbot
    env_file:
      - .env
    volumes:
      - .:/app
    restart: unless-stopped

networks:
  proxy:
    name: ${PROXY_NETWORK:-npm_proxy}
    external: true
