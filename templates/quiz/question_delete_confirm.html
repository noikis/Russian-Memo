{% extends 'base.html' %}

{% load crispy_forms_tags %}

{% block content %}

<h2 class="mb-3">Подтверждение удаления</h2>
<p class="lead">Вы уверены, что хотите удалить вопрос <strong>"{{ question.text }}"</strong>? Отменить действие будет
    невозможно.</p>
<form method="post">
    {% csrf_token %}
    <button type="submit" class="btn btn-danger btn-lg">Да, удалить</button>
    <a href="{% url 'quiz:question_update' quiz.pk question.pk %}" class="btn btn-outline-secondary btn-lg"
        role="button">Отмена</a>
</form>
{% endblock %}
