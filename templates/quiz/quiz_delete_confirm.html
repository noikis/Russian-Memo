{% extends 'base.html' %}

{% load crispy_forms_tags %}

{% block content %}

<h2 class="mb-3">Подтверждение удаления</h2>
<p class="flow-tex">
    Вы уверены, что хотите удалить тест <strong>"{{ quiz.name }}"</strong> ? <br> Отменить действие будет
    невозможно.
</p>
<form method="post">
    {% csrf_token %}
    <button type="submit" class="btn btn-red ">Да, удалить</button>
    <a href="#" class="btn " role="button">Отмена</a>
</form>
{% endblock %}
