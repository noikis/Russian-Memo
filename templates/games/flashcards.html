{% load humanize %} {% load static %}
<!DOCTYPE html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="{%  static 'css/materialize.min.css' %}" />
    <link rel="stylesheet" href="{% static 'css/flashcards.css' %}" />
    <link
      href="https://fonts.googleapis.com/icon?family=Material+Icons"
      rel="stylesheet"
    />

    <title>Карточки</title>
  </head>

  <body class="bg-primary">
    {% include 'layout/_navbar.html' %}

    <div class="container">
      <div class="center">
        {% if practice %}
        <div class="card-container">
          <div class="card white-text z-depth-3" id="flashcard">
            <!-- 	Front	  -->
            <figure class="front card-content white black-text center">
              <h4>{{card.translation}}</h4>
            </figure>
            <!-- 	Back	 -->
            <figure class="back card-content white black-text">
              <h4>{{card.word}}</h4>
              <div class="divider"></div>
              <p>
                <strong>объяснение</strong><br />
                {{card.explanation}}
              </p>
              <p>
                <strong>перевод</strong> : <br />
                {{card.translation}}.
              </p>
              <p>
                <strong>синонимы</strong> : <br />
                {{card.synonymes}}.
              </p>
            </figure>
          </div>
          <button class="btn btn-large bg-secondary" id="flip-btn">Перевернуть</button>
          <form
            class="hide"
            action="{% url 'memo:process_rating' %}"
            method="post"
          >
            {% csrf_token %} {{form}}
            <input type="submit" value="Отправить" class="btn bg-secondary" />
          </form>
        </div>
        {% else %}
        <p class="flow-text">
          Сегодня нет карточек для практики. <br />
          Следующая практика {{ next_due|default:next_practice|naturalday }}.
        </p>
        {% endif %}
      </div>
    </div>
  </body>
  <script src="{% static 'js/materialize.min.js' %}"></script>
  <script src="{% static 'js/flashcards.js' %}"></script>
</html>
