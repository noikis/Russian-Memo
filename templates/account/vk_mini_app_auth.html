<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VK Mini App Auth</title>
    <script>
      (function () {
        const launchParams = window.location.search.slice(1);
        if (!launchParams) {
          window.location.href = "{% url 'account:login' %}";
          return;
        }

        if (window.__vkAuthInFlight) return;
        window.__vkAuthInFlight = true;

        (async () => {
          try {
            const body = new URLSearchParams();
            body.set("launch_params", launchParams);

            const res = await fetch("{% url 'account:vk_miniapp_auth' %}", {
              method: "POST",
              headers: {
                "Content-Type": "application/x-www-form-urlencoded",
                "X-Requested-With": "XMLHttpRequest"
              },
              body: body.toString(),
              credentials: "same-origin"
            });

            const data = await res.json();
            if (data.ok && data.redirect) {
              window.location.href = data.redirect;
              return;
            }

            console.warn("VK Mini App auth failed:", data.error);
            window.location.href = "{% url 'account:login' %}";
          } catch (err) {
            console.error("VK Mini App auth error:", err);
            window.location.href = "{% url 'account:login' %}";
          } finally {
            window.__vkAuthInFlight = false;
          }
        })();
      })();
    </script>
</head>
<body></body>
</html>
