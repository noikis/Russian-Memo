{% extends 'base.html' %}

{% load crispy_forms_tags %}

{% block content %}
<h2 class="mb-3">Подтверждение удаления</h2>
<p class="flow-tex">
    Вы уверены, что хотите удалить карточку <strong>"{{ card.word }}"</strong>? Отменить действие будет
    невозможно.
</p>
<form method="post">
    {% csrf_token %}
    <button type="submit" class="btn red ">Да, удалить</button>
    <a href="{% url 'words:card_update' card.id %}" class="btn blue-grey" role="button">Отмена</a>
</form>
{% endblock %}
